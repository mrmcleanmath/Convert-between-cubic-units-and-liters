<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convert Between Cubic Units and Liters — Mr. McLean Math</title>
<style>
  :root{
    --bg:#f5f6f8;
    --panel:#ffffff;
    --text:#202124;
    --muted:#666b73;
    --border:#d9dde3;
    --accent:#1976d2;
    --accent-soft:#e8f1fb;
    --good:#247a3b;
    --bad:#b3261e;
    --focus:#f5b400;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    line-height:1.45;
  }
  body.high-contrast{
    --bg:#000;--panel:#090909;--text:#fff;--muted:#ddd;--border:#777;
    --accent:#00d7ff;--accent-soft:#111;--good:#68ff8b;--bad:#ff7474;--focus:#ffea00;
  }
  .app{max-width:860px;margin:0 auto;padding:18px}
  header{
    display:flex;justify-content:space-between;align-items:center;
    gap:12px;flex-wrap:wrap;margin-bottom:14px;
  }
  h1{margin:0;font-size:clamp(28px,5vw,36px)}
  .mode-buttons,.settings,.difficulty,.ranges,.ws-controls{
    display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  }
  .settings{justify-content:space-between;margin-bottom:14px}
  button,select,input{font:inherit}
  button,select{
    border:1px solid var(--border);border-radius:10px;background:var(--panel);
    color:var(--text);padding:9px 13px;
  }
  button{cursor:pointer;font-weight:650}
  button:hover{border-color:var(--accent)}
  button:focus-visible,input:focus-visible,select:focus-visible{
    outline:3px solid var(--focus);outline-offset:2px;
  }
  button[aria-pressed="true"],button.primary{
    background:var(--accent);color:#fff;border-color:var(--accent);
  }
  .panel{
    background:var(--panel);border:1px solid var(--border);
    border-radius:16px;padding:18px;
  }
  .practice{display:grid;gap:16px}
  .problem{
    text-align:center;font-size:clamp(26px,5vw,36px);
    font-weight:750;padding:14px 4px;
  }
  .answer-row{
    display:flex;justify-content:center;align-items:center;
    gap:8px;flex-wrap:wrap;
  }
  input[type="text"]{
    width:min(300px,100%);font-size:22px;text-align:center;
    padding:11px 12px;border:1px solid var(--border);border-radius:10px;
    background:var(--panel);color:var(--text);
  }
  .unit{font-size:20px;font-weight:700}
  .feedback{
    min-height:28px;text-align:center;font-size:18px;font-weight:700;
  }
  .feedback.correct{color:var(--good)}
  .feedback.incorrect{color:var(--bad)}
  .steps{
    max-width:650px;width:100%;margin:0 auto;background:var(--accent-soft);
    border:1px solid var(--border);border-radius:11px;padding:11px 13px;
    white-space:pre-line;
  }
  .stats{
    display:flex;justify-content:center;gap:20px;
    color:var(--muted);font-size:15px;
  }
  .note{text-align:center;color:var(--muted);font-size:14px}
  .worksheet{display:none}
  .ws-controls{margin-bottom:14px}
  .ws-list{display:grid;gap:10px}
  .ws-item{
    border:1px solid var(--border);border-radius:11px;padding:10px 12px;
    break-inside:avoid;
  }
  .ws-answer{display:none;margin-top:6px;color:var(--good);font-weight:700}
  .ws-reveal{margin-top:7px;padding:6px 10px;font-size:14px}
  footer{text-align:center;color:var(--muted);font-size:14px;margin-top:18px}
  .sr-only{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}
  @media(max-width:620px){
    .app{padding:13px}.panel{padding:14px}
    .answer-row{align-items:stretch}
    input[type="text"],.answer-row button{width:100%}
  }
  @media print{
    header,.settings,footer,.ws-controls,.ws-reveal{display:none!important}
    body{background:#fff;color:#000}.app{max-width:none;padding:0}
    .panel{border:0;padding:0;background:#fff}.worksheet{display:block!important}
    .ws-item{border:0;border-bottom:1px solid #aaa;border-radius:0}
    .ws-answer{display:none!important}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Convert Between Cubic Units and Liters</h1>
    <div class="mode-buttons" role="group" aria-label="Mode">
      <button id="practiceBtn" aria-pressed="true">Practice</button>
      <button id="worksheetBtn" aria-pressed="false">Worksheet</button>
    </div>
  </header>

  <div class="settings">
    <div class="difficulty" id="difficulty" role="group" aria-label="Difficulty">
      <button data-diff="basic" aria-pressed="true">Basic</button>
      <button data-diff="advanced" aria-pressed="false">Advanced</button>
    </div>

    <div class="ranges">
      <label for="rangeSelect">Value range:</label>
      <select id="rangeSelect">
        <option value="small">0.1 – 50</option>
        <option value="medium">0.1 – 5 000</option>
        <option value="large">0.1 – 200 000</option>
      </select>
      <button id="contrastBtn" aria-pressed="false">High contrast</button>
    </div>
  </div>

  <section id="practice" class="panel practice">
    <div id="problem" class="problem" aria-live="polite"></div>

    <div class="answer-row">
      <input id="answer" type="text" inputmode="decimal" autocomplete="off"
             aria-label="Your answer" placeholder="Enter number">
      <span id="targetUnit" class="unit"></span>
      <button id="check" class="primary">Check</button>
      <button id="next" hidden>Next</button>
      <button id="clear">Clear</button>
    </div>

    <div class="note">Enter the number only. Dot or comma decimals are accepted.</div>
    <div id="feedback" class="feedback" aria-live="polite"></div>

    <button id="showSteps" hidden style="justify-self:center">Show steps</button>
    <div id="steps" class="steps" hidden></div>

    <div class="stats">
      <span>Correct: <strong id="correctCount">0</strong></span>
      <span>Incorrect: <strong id="incorrectCount">0</strong></span>
    </div>
  </section>

  <section id="worksheet" class="panel worksheet">
    <div class="ws-controls">
      <label for="wsCount">Questions:</label>
      <select id="wsCount">
        <option value="5">5</option>
        <option value="10" selected>10</option>
        <option value="15">15</option>
      </select>
      <button id="generateWs">Generate</button>
      <button id="revealAll">Reveal all</button>
      <button id="hideAll">Hide all</button>
      <button id="printWs">Print</button>
    </div>
    <div id="wsList" class="ws-list"></div>
  </section>

  <footer>Created by Mr. McLean Math</footer>
  <div id="live" class="sr-only" aria-live="assertive"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));

/*
  Exact powers of ten relative to liters:
  1 cm³ = 1 mL
  1 dm³ = 1 L
  1 m³  = 1000 L
*/
const EXP={
  'mm³':-6,'cm³':-3,'dm³':0,'m³':3,
  'mL':-3,'cL':-2,'dL':-1,'L':0,'kL':3
};

const CUBIC=['mm³','cm³','dm³','m³'];
const LITER=['mL','cL','dL','L','kL'];
const BASIC_CUBIC=['cm³','dm³','m³'];
const BASIC_LITER=['mL','L'];

const state={
  mode:'practice',
  difficulty:'basic',
  range:'small',
  current:null,
  evaluated:false,
  correct:0,
  incorrect:0,
  recent:[]
};

function randInt(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}

function trimZeros(s){
  return s.includes('.') ? s.replace(/0+$/,'').replace(/\.$/,'') : s;
}

function canonicalDecimal(raw){
  let s=String(raw).trim().replace(/\s+/g,'');
  if(!s)return null;
  if(s.includes('.')&&s.includes(','))return null;
  if(s.includes(','))s=s.replace(',','.');
  if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return null;
  s=s.replace(/^\+/,'');
  if(s.startsWith('.'))s='0'+s;
  let [whole,frac='']=s.split('.');
  whole=whole.replace(/^0+(?=\d)/,'')||'0';
  frac=frac.replace(/0+$/,'');
  return frac ? whole+'.'+frac : whole;
}

function shiftDecimalString(value,shift){
  const normalized=canonicalDecimal(value);
  if(normalized==null)return null;

  let [whole,frac='']=normalized.split('.');
  let digits=(whole+frac).replace(/^0+(?=\d)/,'')||'0';
  const newFracLen=frac.length-shift;
  let out;

  if(newFracLen<=0){
    out=digits+'0'.repeat(-newFracLen);
  }else if(newFracLen>=digits.length){
    out='0.'+'0'.repeat(newFracLen-digits.length)+digits;
  }else{
    out=digits.slice(0,digits.length-newFracLen)+'.'+digits.slice(digits.length-newFracLen);
  }
  return canonicalDecimal(out);
}

function formatNumber(s){
  const normalized=canonicalDecimal(s);
  if(normalized==null)return String(s);
  let [whole,frac='']=normalized.split('.');
  whole=whole.replace(/\B(?=(\d{3})+(?!\d))/g,' ');
  return frac?whole+'.'+frac:whole;
}

function rangeMax(key){
  if(key==='small')return 50;
  if(key==='medium')return 5000;
  return 200000;
}

function randomValueString(key){
  const max=rangeMax(key);
  if(Math.random()<0.5){
    return String(randInt(1,max));
  }
  const tenths=randInt(1,max*10);
  return trimZeros((tenths/10).toFixed(1));
}

function makeProblem(){
  let fromU,toU;

  if(state.difficulty==='basic'){
    if(Math.random()<0.5){
      fromU=pick(BASIC_CUBIC);
      toU=pick(LITER);
    }else{
      fromU=pick(BASIC_LITER);
      toU=pick(CUBIC);
    }
  }else{
    if(Math.random()<0.5){
      fromU=pick(CUBIC);
      toU=pick(LITER);
    }else{
      fromU=pick(LITER);
      toU=pick(CUBIC);
    }
  }

  const valueStr=randomValueString(state.range);
  const shift=EXP[fromU]-EXP[toU];
  const answerStr=shiftDecimalString(valueStr,shift);
  const key=[fromU,toU,valueStr].join('|');

  return {fromU,toU,valueStr,answerStr,shift,key};
}

function newQuestion(){
  let p,tries=0;
  do{
    p=makeProblem();
    tries++;
  }while(state.recent.includes(p.key)&&tries<100);

  state.current=p;
  state.evaluated=false;
  state.recent.push(p.key);
  if(state.recent.length>60)state.recent.shift();

  $('#problem').textContent=
    `${formatNumber(p.valueStr)} ${p.fromU} = _____ ${p.toU}`;
  $('#targetUnit').textContent=p.toU;
  $('#answer').value='';
  $('#answer').disabled=false;
  $('#check').disabled=false;
  $('#next').hidden=true;
  $('#clear').disabled=false;
  $('#feedback').textContent='';
  $('#feedback').className='feedback';
  $('#showSteps').hidden=true;
  $('#steps').hidden=true;
  $('#steps').textContent='';
  $('#answer').focus();
}

function stepsText(p){
  const n=Math.abs(p.shift);
  const factor='1'+'0'.repeat(n);

  if(p.shift===0){
    return `${p.fromU} and ${p.toU} have the same value size.
${formatNumber(p.valueStr)} ${p.fromU} = ${formatNumber(p.answerStr)} ${p.toU}`;
  }

  const action=p.shift>0?'Multiply':'Divide';
  const symbol=p.shift>0?'×':'÷';

  return `Conversion factor: 10^${n} = ${formatNumber(factor)}
${action} by ${formatNumber(factor)}.
${formatNumber(p.valueStr)} ${p.fromU} ${symbol} ${formatNumber(factor)} = ${formatNumber(p.answerStr)} ${p.toU}`;
}

function announce(msg){
  const el=$('#live');el.textContent='';
  setTimeout(()=>el.textContent=msg,10);
}

function checkAnswer(){
  if(state.evaluated||!state.current)return;

  const user=canonicalDecimal($('#answer').value);
  if(user==null){
    $('#feedback').textContent='Enter a valid number first.';
    $('#feedback').className='feedback incorrect';
    announce('Enter a valid number first.');
    return;
  }

  state.evaluated=true;
  $('#answer').disabled=true;
  $('#check').disabled=true;
  $('#next').hidden=false;
  $('#clear').disabled=true;

  if(user===canonicalDecimal(state.current.answerStr)){
    state.correct++;
    $('#feedback').textContent='Correct!';
    $('#feedback').className='feedback correct';
    announce('Correct');
  }else{
    state.incorrect++;
    $('#feedback').textContent=
      `Incorrect. Correct answer: ${formatNumber(state.current.answerStr)} ${state.current.toU}`;
    $('#feedback').className='feedback incorrect';
    $('#showSteps').hidden=false;
    announce('Incorrect');
  }

  $('#correctCount').textContent=state.correct;
  $('#incorrectCount').textContent=state.incorrect;
}

$('#check').addEventListener('click',checkAnswer);
$('#next').addEventListener('click',newQuestion);
$('#clear').addEventListener('click',()=>{
  if(state.evaluated)return;
  $('#answer').value='';$('#answer').focus();
});
$('#showSteps').addEventListener('click',()=>{
  $('#steps').textContent=stepsText(state.current);
  $('#steps').hidden=false;
  $('#showSteps').hidden=true;
});

$('#answer').addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    e.preventDefault();
    if(state.evaluated)newQuestion();
    else checkAnswer();
  }else if(e.key==='Escape'&&!state.evaluated){
    $('#answer').value='';
  }
});

$('#difficulty').addEventListener('click',e=>{
  const b=e.target.closest('button[data-diff]');
  if(!b)return;
  state.difficulty=b.dataset.diff;
  state.recent=[];
  $$('#difficulty button').forEach(x=>
    x.setAttribute('aria-pressed',String(x===b))
  );
  if(state.mode==='practice')newQuestion();
});

$('#rangeSelect').addEventListener('change',()=>{
  state.range=$('#rangeSelect').value;
  state.recent=[];
  if(state.mode==='practice')newQuestion();
});

function setMode(mode){
  state.mode=mode;
  const practice=mode==='practice';
  $('#practice').style.display=practice?'grid':'none';
  $('#worksheet').style.display=practice?'none':'block';
  $('#practiceBtn').setAttribute('aria-pressed',String(practice));
  $('#worksheetBtn').setAttribute('aria-pressed',String(!practice));
  if(practice)newQuestion();
  else if(!$('#wsList').children.length)renderWorksheet();
}

$('#practiceBtn').addEventListener('click',()=>setMode('practice'));
$('#worksheetBtn').addEventListener('click',()=>setMode('worksheet'));

$('#contrastBtn').addEventListener('click',()=>{
  const on=document.body.classList.toggle('high-contrast');
  $('#contrastBtn').setAttribute('aria-pressed',String(on));
});

function renderWorksheet(){
  const list=$('#wsList');
  list.innerHTML='';
  const count=Number($('#wsCount').value)||10;
  const used=new Set();

  for(let i=1;i<=count;i++){
    let p,tries=0;
    do{
      p=makeProblem();
      tries++;
    }while(used.has(p.key)&&tries<100);
    used.add(p.key);

    const item=document.createElement('div');
    item.className='ws-item';
    item.innerHTML=`
      <div><strong>${i}.</strong> ${formatNumber(p.valueStr)} ${p.fromU} = ______ ${p.toU}</div>
      <button class="ws-reveal" aria-expanded="false">Reveal</button>
      <div class="ws-answer">Answer: ${formatNumber(p.answerStr)} ${p.toU}</div>`;

    const b=item.querySelector('.ws-reveal');
    const a=item.querySelector('.ws-answer');
    b.addEventListener('click',()=>{
      const showing=a.style.display==='block';
      a.style.display=showing?'none':'block';
      b.textContent=showing?'Reveal':'Hide';
      b.setAttribute('aria-expanded',String(!showing));
    });
    list.appendChild(item);
  }
}

$('#generateWs').addEventListener('click',renderWorksheet);
$('#revealAll').addEventListener('click',()=>{
  $$('#wsList .ws-answer').forEach(a=>a.style.display='block');
  $$('#wsList .ws-reveal').forEach(b=>{
    b.textContent='Hide';b.setAttribute('aria-expanded','true');
  });
});
$('#hideAll').addEventListener('click',()=>{
  $$('#wsList .ws-answer').forEach(a=>a.style.display='none');
  $$('#wsList .ws-reveal').forEach(b=>{
    b.textContent='Reveal';b.setAttribute('aria-expanded','false');
  });
});
$('#printWs').addEventListener('click',()=>window.print());

function runDevTests(){
  const failures=[];
  const assert=(name,cond)=>{if(!cond)failures.push(name)};

  assert('1 cm³ = 1 mL',shiftDecimalString('1',EXP['cm³']-EXP['mL'])==='1');
  assert('1 dm³ = 1 L',shiftDecimalString('1',EXP['dm³']-EXP['L'])==='1');
  assert('1 m³ = 1000 L',shiftDecimalString('1',EXP['m³']-EXP['L'])==='1000');
  assert('1000 cm³ = 1 L',shiftDecimalString('1000',EXP['cm³']-EXP['L'])==='1');
  assert('1 L = 1000000 mm³',shiftDecimalString('1',EXP['L']-EXP['mm³'])==='1000000');
  assert('comma decimal canonical',canonicalDecimal('1,50')==='1.5');
  assert('blank rejected',canonicalDecimal('')===null);
  assert('mixed separators rejected',canonicalDecimal('1,234.5')===null);

  for(const from of CUBIC){
    for(const to of LITER){
      for(const v of ['0.1','1','2.5','50','5000','200000']){
        const result=shiftDecimalString(v,EXP[from]-EXP[to]);
        const expected=Number(v)*10**(EXP[from]-EXP[to]);
        assert(`${from}->${to}`,Math.abs(Number(result)-expected)<=1e-10*Math.max(1,Math.abs(expected)));
      }
    }
  }
  for(const from of LITER){
    for(const to of CUBIC){
      for(const v of ['0.1','1','2.5','50','5000','200000']){
        const result=shiftDecimalString(v,EXP[from]-EXP[to]);
        const expected=Number(v)*10**(EXP[from]-EXP[to]);
        assert(`${from}->${to}`,Math.abs(Number(result)-expected)<=1e-10*Math.max(1,Math.abs(expected)));
      }
    }
  }

  console.log(failures.length?'DEV TESTS: FAIL':'DEV TESTS: PASS',failures);
}

newQuestion();
if(new URLSearchParams(location.search).get('dev')==='1')runDevTests();
</script>
</body>
</html>
